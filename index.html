<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062f5e">
  <title>Interaktiv adventskalender</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #031d38; }
    body {
      display: grid;
      place-items: start center;
      overflow-x: hidden;
      font-family: system-ui, sans-serif;
    }

    .calendar {
      position: relative;
      width: min(100vw, calc(100vh * 1365 / 2048));
      aspect-ratio: 1365 / 2048;
      background: url("Kalender-CLOSED.png") center / 100% 100% no-repeat;
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .calendar::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: transparent;
      z-index: 10;
    }

    .door {
      position: absolute;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1100px;
      z-index: 2;
      touch-action: manipulation;
    }

    .reveal,
    .flap,
    .face {
      position: absolute;
      inset: 0;
    }

    .reveal {
      background-image: url("Kalender-OPEN.png");
      background-repeat: no-repeat;
      background-size: var(--scene-w) var(--scene-h);
      background-position: var(--scene-x) var(--scene-y);
    }

    .flap {
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 760ms cubic-bezier(.18,.72,.2,1), filter 760ms ease;
      will-change: transform;
    }

    .face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-repeat: no-repeat;
      background-size: var(--scene-w) var(--scene-h);
      background-position: var(--scene-x) var(--scene-y);
    }

    .front { background-image: url("Kalender-CLOSED.png"); }
    .back {
      transform: rotateY(180deg);
      background-image: url("Kalender-CLOSED.png");
      filter: brightness(.7) saturate(.82);
    }

    .door[aria-expanded="true"] { z-index: 6; }
    .door[aria-expanded="true"] .flap {
      transform: rotateY(-108deg);
      filter: drop-shadow(11px 8px 8px rgba(0,0,0,.36));
    }

    .door:focus-visible {
      outline: 3px solid rgba(255,220,92,.95);
      outline-offset: 3px;
    }

    .door-1 { left: 62.86%; top: 17.87%; width: 11.28%; height: 11.13%; }
    .door-2 { left: 9.08%;  top: 44.14%; width: 11.14%; height: 11.47%; }
    .door-3 { left: 68.57%; top: 72.98%; width: 11.14%; height: 10.74%; }
    .door-4 { left: 29.38%; top: 78.76%; width: 11.06%; height: 11.33%; }

    @media (prefers-reduced-motion: reduce) {
      .flap { transition-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main class="calendar" id="calendar" aria-label="Interaktiv adventskalender med fyra luckor">
    <button class="door door-1" type="button" data-door="1" aria-expanded="false" aria-label="Öppna lucka 1"><span class="reveal"></span><span class="flap"><span class="face front"></span><span class="face back"></span></span></button>
    <button class="door door-2" type="button" data-door="2" aria-expanded="false" aria-label="Öppna lucka 2"><span class="reveal"></span><span class="flap"><span class="face front"></span><span class="face back"></span></span></button>
    <button class="door door-3" type="button" data-door="3" aria-expanded="false" aria-label="Öppna lucka 3"><span class="reveal"></span><span class="flap"><span class="face front"></span><span class="face back"></span></span></button>
    <button class="door door-4" type="button" data-door="4" aria-expanded="false" aria-label="Öppna lucka 4"><span class="reveal"></span><span class="flap"><span class="face front"></span><span class="face back"></span></span></button>
  </main>

  <script>
    (() => {
      const IMAGE_W = 1365;
      const IMAGE_H = 2048;
      const STORAGE_KEY = 'luma-adventskalender-open-doors';
      const doors = [...document.querySelectorAll('.door')];

      function setImageCrop(door) {
        const box = door.getBoundingClientRect();
        const calendar = document.getElementById('calendar').getBoundingClientRect();
        const scaleX = calendar.width / IMAGE_W;
        const scaleY = calendar.height / IMAGE_H;
        const x = door.offsetLeft;
        const y = door.offsetTop;
        door.style.setProperty('--scene-w', `${calendar.width}px`);
        door.style.setProperty('--scene-h', `${calendar.height}px`);
        door.style.setProperty('--scene-x', `${-x}px`);
        door.style.setProperty('--scene-y', `${-y}px`);
      }

      function loadState() {
        try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
        catch { return new Set(); }
      }

      const openDoors = loadState();

      function renderDoor(door, isOpen) {
        const number = door.dataset.door;
        door.setAttribute('aria-expanded', String(isOpen));
        door.setAttribute('aria-label', `${isOpen ? 'Stäng' : 'Öppna'} lucka ${number}`);
      }

      doors.forEach(door => {
        renderDoor(door, openDoors.has(door.dataset.door));
        door.addEventListener('click', () => {
          const number = door.dataset.door;
          const isOpen = door.getAttribute('aria-expanded') !== 'true';
          renderDoor(door, isOpen);
          isOpen ? openDoors.add(number) : openDoors.delete(number);
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...openDoors]));
        });
      });

      function updateCrops() { doors.forEach(setImageCrop); }
      window.addEventListener('load', updateCrops);
      window.addEventListener('resize', updateCrops, { passive: true });
      updateCrops();
    })();
  </script>
</body>
</html>
